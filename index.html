<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>research hahaahahhaa</title>
<style>
  :root {
    --bg: #b413ff;
    --card: #2b2018;
    --accent: #4c00b0;
    --accent-dark: #b003d2;
    --text: #efefef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(180deg, #ca66e0, #af2ebd3f 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }
  h1 {
    letter-spacing: 2px;
    font-size: 2.2rem;
    margin-bottom: 6px;
    text-align: center;
  }
  p.subtitle {
    color: #e9e9e9;
    margin-top: 0;
    margin-bottom: 30px;
    font-style: italic;
    text-align: center;
  }
  .open-btn {
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    color: #2b2018;
    border: none;
    padding: 14px 34px;
    font-size: 1.05rem;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: 1px;
  }
  .open-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(0,0,0,0.5);
  }

  .collage {
    display: none;
    margin-top: 40px;
    max-width: 900px;
    width: 100%;
    position: relative;
    height: 620px;
  }
  .collage.show {
    display: block;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .polaroid {
    position: absolute;
    background: #fdf9f0;
    padding: 10px 10px 40px 10px;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, z-index 0s;
    width: 260px;
  }
  .polaroid img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    display: block;
    border-radius: 2px;
  }
  .polaroid span {
    display: block;
    text-align: center;
    color: #333;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 0.85rem;
    margin-top: 10px;
  }
  .polaroid:hover {
    transform: scale(1.08) rotate(0deg) !important;
    z-index: 50 !important;
    box-shadow: 0 18px 35px rgba(0,0,0,0.6);
  }

  .p1 { top: 10px;  left: 30px;  transform: rotate(-8deg); }
  .p2 { top: 40px;  left: 330px; transform: rotate(5deg); z-index: 3; }
  .p3 { top: 300px; left: 60px;  transform: rotate(6deg); }
  .p4 { top: 350px; left: 350px; transform: rotate(-6deg); }
  .p5 { top: 140px; left: 610px; transform: rotate(4deg); }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 78vh;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
  }
  .lightbox .close-btn {
    position: absolute;
    top: 24px;
    right: 34px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 2.4rem;
    cursor: pointer;
    line-height: 1;
  }
  .nav-btn {
    background: rgba(166, 12, 237, 0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 1.6rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }
  .nav-btn:hover { background: rgba(199, 63, 206, 0.3); }
  .prev-btn { left: 20px; }
  .next-btn { right: 20px; }
  .counter {
    margin-top: 16px;
    color: #cbb896;
    font-style: italic;
  }

  @media (max-width: 700px) {
    .collage { height: auto; }
    .polaroid {
      position: static;
      transform: none !important;
      width: 90%;
      margin: 16px auto;
    }
    .polaroid:hover { transform: scale(1.03) !important; }
  }
</style>
</head>
<body>

  <h1>PR2 Group 1</h1>
  <p class="subtitle"></p>

  <button class="open-btn" onclick="toggleCollage()">Pindota :) </button>

  <div class="collage" id="collage">
    <div class="polaroid p1" onclick="openLightbox(0)">
      <img src="images/photo1.png" alt="Photo 1">
      <span>1st Meetup (Way Nabuhat)</span>
    </div>
    <div class="polaroid p2" onclick="openLightbox(1)">
      <img src="images/photo2.png" alt="Photo 2">
      <span>Nagpapicture ug di kaila HAHAHAHA</span>
    </div>
    <div class="polaroid p3" onclick="openLightbox(2)">
      <img src="images/photo3.png" alt="Photo 3">
      <span>wow whale shark</span>
    </div>
    <div class="polaroid p4" onclick="openLightbox(3)">
      <img src="images/photo4.png" alt="Photo 4">
      <span>wow artists</span>
    </div>
    <div class="polaroid p5" onclick="openLightbox(4)">
      <img src="images/photo5.png" alt="Photo 5">
      <span>Practice para final defense</span>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="navigate(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="nav-btn next-btn" onclick="navigate(1)">&#10095;</button>
    <div class="counter" id="counter"></div>
  </div>

<script>
  const images = [
    'images/photo1.png',
    'images/photo2.png',
    'images/photo3.png',
    'images/photo4.png',
    'images/photo5.png'
  ];
  let currentIndex = 0;

  function toggleCollage() {
    const collage = document.getElementById('collage');
    collage.classList.toggle('show');
  }

  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    document.getElementById('lightbox').classList.add('show');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
  }

  function navigate(delta) {
    currentIndex = (currentIndex + delta + images.length) % images.length;
    updateLightbox();
  }

  function updateLightbox() {
    document.getElementById('lightbox-img').src = images[currentIndex];
    document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + images.length;
  }

  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lightbox').classList.contains('show')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'ArrowLeft') navigate(-1);
  });

  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
</script>

</body>
</html>
