<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>research hahaahahhaa</title>
<style>
  :root {
    --bg: #b413ff;
    --card: #2b2018;
    --accent: #4c00b0;
    --accent-dark: #7d227d;
    --text: #efefef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(180deg, #ca66e0, #af2ebd3f 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 6px;
  }
  h1 {
    letter-spacing: 2px;
    font-size: 2.2
    rem;
    margin: 0;
    text-align: center;
  }
  .cat-icon {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
  }
  p.subtitle {
    color: #e9e9e9;
    margin-top: 0;
    margin-bottom: 30px;
    font-style: italic;
    text-align: center;
  }
  .open-btn {
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    color: #522709;
    border: none;
    padding: 14px 34px;
    font-size: 1.05rem;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: 1px;
  }
  .open-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(0,0,0,0.5);
  }

  .video-btn {
    margin-top: 18px;
    background: linear-gradient(180deg, #a51aa1, #cf53ac);
    color: #2d1d33;
    border: none;
    padding: 12px 26px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .video-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 22px rgba(0, 0, 0, 0.28);
  }

  .video-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .video-modal.show {
    display: flex;
  }
  .video-modal-inner {
    position: relative;
    width: min(90vw, 1100px);
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  }
  .video-modal-inner video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .video-close {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
  }

  .collage {
    display: none;
    margin-top: 40px;
    max-width: 1400px;
    width: 100%;
    position: relative;
    height: 1200px;
  }
  .collage.show {
    display: block;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .polaroid {
    position: absolute;
    background: #fdf9f0;
    padding: 10px 10px 40px 10px;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, z-index 0s;
    width: 260px;
    z-index: 2;
  }
  .polaroid img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    display: block;
    border-radius: 2px;
  }
  .polaroid span {
    display: block;
    text-align: center;
    color: #333;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 0.85rem;
    margin-top: 10px;
  }
  .polaroid:hover {
    transform: scale(1.08) rotate(0deg) !important;
    z-index: 50 !important;
    box-shadow: 0 18px 35px rgba(0,0,0,0.6);
  }

  .p1 { top: 10px;  left: 20px;  transform: rotate(-8deg); z-index: 9; }
  .p2 { top: 30px;  left: 300px; transform: rotate(5deg); z-index: 9; }
  .p3 { top: 290px; left: 50px;  transform: rotate(6deg); z-index: 9; }
  .p4 { top: 360px; left: 325px; transform: rotate(-6deg); z-index: 9; }
  .p5 { top: 150px; left: 600px; transform: rotate(4deg); z-index: 9; }
  .p6 { top: 70px;  left: 930px; transform: rotate(-5deg); z-index: 2; }
  .p7 { top: 260px; left: 980px; transform: rotate(7deg); z-index: 2; }
  .p8 { top: 530px; left: 120px; transform: rotate(-7deg); z-index: 2; }
  .p9 { top: 540px; left: 420px; transform: rotate(5deg); z-index: 2; }
  .p10 { top: 590px; left: 720px; transform: rotate(-6deg); z-index: 2; }
  .p11 { top: 820px; left: 170px; transform: rotate(4deg); z-index: 2; }
  .p12 { top: 860px; left: 520px; transform: rotate(-4deg); z-index: 2; }
  .p13 { top: 860px; left: 890px; transform: rotate(6deg); z-index: 2; }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 78vh;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
  }
  .lightbox .close-btn {
    position: absolute;
    top: 24px;
    right: 34px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 2.4rem;
    cursor: pointer;
    line-height: 1;
  }
  .nav-btn {
    background: rgba(166, 12, 237, 0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 1.6rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }
  .nav-btn:hover { background: rgba(199, 63, 206, 0.3); }
  .prev-btn { left: 20px; }
  .next-btn { right: 20px; }
  .counter {
    margin-top: 16px;
    color: #cbb896;
    font-style: italic;
  }

  @media (max-width: 700px) {
    .collage { height: auto; }
    .polaroid {
      position: static;
      transform: none !important;
      width: 90%;
      margin: 16px auto;
    }
    .polaroid:hover { transform: scale(1.03) !important; }
  }
</style>
</head>
<body>

  <div class="page-header">
    <h1>PR2 Group 1</h1>
    <img class="cat-icon" src="images/cat.png" alt="Cat icon">
  </div>
  <p class="subtitle"></p>

  <button class="open-btn" onclick="toggleCollage()">Pindota :) </button>
  <button class="video-btn" onclick="openVideo()">Transition
  </button>

  <div class="video-modal" id="videoModal" aria-hidden="true">
    <div class="video-modal-inner">
      <button class="video-close" onclick="closeVideo()" aria-label="Close video">&times;</button>
      <video id="researchVideo" controls playsinline preload="metadata">
        <source src="images/research.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <div class="collage" id="collage">
    <div class="polaroid p1" onclick="openLightbox(0)">
      <img src="images/photo1.png" alt="Photo 1">
      <span>1st Meetup (Way Nabuhat)</span>
    </div>
    <div class="polaroid p2" onclick="openLightbox(1)">
      <img src="images/photo2.png" alt="Photo 2">
      <span>Nagpapicture ug di kaila HAHAHAHA</span>
    </div>
    <div class="polaroid p3" onclick="openLightbox(2)">
      <img src="images/photo3.png" alt="Photo 3">
      <span>wow whale shark</span>
    </div>
    <div class="polaroid p4" onclick="openLightbox(3)">
      <img src="images/photo4.png" alt="Photo 4">
      <span>wow artists</span>
    </div>
    <div class="polaroid p5" onclick="openLightbox(4)">
      <img src="images/photo5.png" alt="Photo 5">
      <span>Practice para final defense</span>
    </div>
    <div class="polaroid p6" onclick="openLightbox(5)">
     
    </div>
    <div class="polaroid p7" onclick="openLightbox(6)">
      <img src="images/photo7.png" alt="Photo 7">
    </div>
    <div class="polaroid p8" onclick="openLightbox(7)">
      <img src="images/photo8.png.jpg" alt="Photo 8">
    </div>
    <div class="polaroid p9" onclick="openLightbox(8)">
      <img src="images/photo9.png" alt="Photo 9">
    </div>
    <div class="polaroid p10" onclick="openLightbox(9)">
      <img src="images/photo10.png" alt="Photo 10">
    </div>
    <div class="polaroid p11" onclick="openLightbox(10)">
      <img src="images/photo11.png" alt="Photo 11">
    </div>
    <div class="polaroid p12" onclick="openLightbox(11)">
      <img src="images/photo12.png" alt="Photo 12">
    </div>
    <div class="polaroid p13" onclick="openLightbox(12)">
      <img src="images/photo13.png" alt="Photo 13">
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="navigate(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="nav-btn next-btn" onclick="navigate(1)">&#10095;</button>
    <div class="counter" id="counter"></div>
  </div>

<script>
  const images = [
    'images/photo1.png',
    'images/photo2.png',
    'images/photo3.png',
    'images/photo4.png',
    'images/photo5.png',
    'images/photo6.png',
    'images/photo7.png',
    'images/photo8.png.jpg',
    'images/photo9.png',
    'images/photo10.png',
    'images/photo11.png',
    'images/photo12.png',
    'images/photo13.png'
  ];
  let currentIndex = 0;

  function toggleCollage() {
    const collage = document.getElementById('collage');
    collage.classList.toggle('show');
  }

  function openVideo() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('researchVideo');
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
    video.play().catch(() => {});
  }

  function closeVideo() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('researchVideo');
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
    video.pause();
    video.currentTime = 0;
  }

  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    document.getElementById('lightbox').classList.add('show');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
  }

  function navigate(delta) {
    currentIndex = (currentIndex + delta + images.length) % images.length;
    updateLightbox();
  }

  function updateLightbox() {
    document.getElementById('lightbox-img').src = images[currentIndex];
    document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + images.length;
  }

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('videoModal').classList.contains('show') && e.key === 'Escape') {
      closeVideo();
    }
    if (!document.getElementById('lightbox').classList.contains('show')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'ArrowLeft') navigate(-1);
  });

  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });

  document.getElementById('videoModal').addEventListener('click', (e) => {
    if (e.target.id === 'videoModal') closeVideo();
  });
</script>

</body>
</html>
